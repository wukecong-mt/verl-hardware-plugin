working_dir: ./
excludes:
  - "/.git/"
  - "extra_data"
  - ".json"
  - "checkpoints"
  - "output"
  - "outputs"
  - "logs"
  - "profiles"
  - ".log"
  - ".safetensors"
  - ".pt"

env_vars:
  VERL_PLATFORM: "musa"
  VERL_USE_EXTERNAL_MODULES: "verl_hardware_plugin"
  # Ray exposes MUSA through its GPU resource but does not manage
  # MUSA_VISIBLE_DEVICES.  Let verl's existing Ray worker path select the
  # assigned device from get_accelerator_ids().
  RAY_EXPERIMENTAL_NOSET_MUSA_VISIBLE_DEVICES: "1"
  ACCELERATOR_BACKEND: "musa"
  TENSORBOARD_DIR: "${TENSORBOARD_DIR}"
  MUSA_PATCH_PATH: "${MUSA_PATCH_PATH}"
  VERL_MUSA_ATTENTION_DEBUG: "${VERL_MUSA_ATTENTION_DEBUG}"
  VERL_SGLANG_HTTP_TIMEOUT: "${VERL_SGLANG_HTTP_TIMEOUT}"
  # MLA head_dim=192 is unsupported by the MUSA FlashAttention varlen kernel.
  # Let TE try its fused backend instead; this is propagated by the launcher.
  MUSA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  MCCL_LIB: "/usr/local/musa/lib/libmccl.so"
  LD_LIBRARY_PATH: "/usr/local/musa/lib:$LD_LIBRARY_PATH"
  MUSA_EXECUTION_TIMEOUT: "3000000"
  MCCL_TIMEOUT: "600000"
  MCCL_PROTOS: "2"
  MCCL_CHECK_POINTERS: "0"
  MCCL_ALGOS: "1"
  MCCL_IB_GID_INDEX: "3"
  MCCL_BUFFSIZE: "20971520"
  MUSA_BLOCK_SCHEDULE_MODE: "1"
  MUSA_BLOCK_DISTRIBUTION_GRANULARITY: "0"
  MCCL_MAX_NCHANNELS: "14"
  MCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_6,mlx5_7,mlx5_8,mlx5_9"
  TOKENIZERS_PARALLELISM: "false"
  VERL_LOGGING_LEVEL: "INFO"
  HYDRA_FULL_ERROR: "1"
  RAY_BACKEND_LOG_LEVEL: "debug"
  RAY_OVERRIDE_JOB_RUNTIME_ENV: "1"
  VLLM_USE_V1: "1"
  VLLM_PATCH_MUSA_CUSTOM_OPS: "1"
  SGLANG_MUSA_GRAPH_COMPAT: "1"
  ACCELERATE_USE_FSDP: "1"
  FSDP_CPU_RAM_EFFICIENT_LOADING: "1"
  GLOO_SOCKET_IFNAME: "bond0"
  # Launch blocking was useful for the short sampler diagnosis, but it can
  # desynchronize SGLang TP scheduler request broadcasts during long rollout.
  MUSA_LAUNCH_BLOCKING: "0"
  #MEGATRON_BRIDGE_PATH: "/mnt/his_test/kechun.wu/rl_workspace/0719/Megatron-Bridge/src"
  # VERL_PATH is rendered by the launcher from its current checkout.
  # MEGATRON_PATH: /mnt/his_test/kechun.wu/rl_workspace/0719/Megatron-LM
  # MUSA_PATCH_PATH: /mnt/his_test/kechun.wu/rl_workspace/0719/megatron-lm-musa-patch
  PYTHONPATH: "${VERL_PLUGIN_PATH}:${VERL_PLUGIN_PATH}/scripts/musa:${VERL_PATH}:${MEGATRON_PATH}:${MEGATRON_BRIDGE_PATH}:${MUSA_PATCH_PATH}:$PYTHONPATH"
  # A/B diagnostic: retain a CPU backup of KV cache across release/resume.
  SGLANG_MUSA_KV_CACHE_CPU_BACKUP: "1"
  SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE: "0"
  # Keep the TP startup check enabled so unrelated GPU occupants are detected
  # before a rollout server starts loading the 122B checkpoint.
  SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "1"
  # [MUSA plugin change] MATE head_dim=256 backward currently fails MuDNN's
  # varlen LSE validation during VERL actor update; keep the ABI/LSE adapter
  # installed but route the operation through native MUSA FlashAttention.
  SLIME_PATCH_MUSA_FLASH_ATTN_MATE: "1"
  # [MUSA plugin debug] Synchronize after the TileLang MATE backward kernel so
  # an asynchronous device error is reported at the actual kernel boundary.
  MUSA_MATE_BWD_SYNC: "0"
  SGLANG_MUSA_USE_JIT_ALL_REDUCE: "0"
  MUSA_TE_MOE_SORT_FASTPATH: "1"
  # Validated on Qwen3.5-122B: publish one dependency after all CPU optimizer
  # H2D copy-backs instead of making the compute stream wait per parameter.
  MUSA_GDN_BWD_WARPS8: "0"
  # Normal path only validates already-materialized split metadata; repair is
  # entered only when the local permutation size and async D2H split sum differ.
  #SGLANG_USE_CUDA_IPC_TRANSPORT: "1"
  #SGLANG_USE_IPC_POOL_HANDLE_CACHE: "1"
  #SGLANG_MM_FEATURE_CACHE_MB: "2048"
  VERL_MEGATRON_FALSE_LOSS_PRESCALE: "token_mean"
  MUSA_BF16_DENSE_TFLOPS: "458"
  VERL_PLATFORM: "musa"
  VERL_SGLANG_HTTP_TIMEOUT: "600"
